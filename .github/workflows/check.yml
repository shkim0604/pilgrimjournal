name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Xcode build as local development (26.2, 17C52), so the toolchain,
  # swift-format and SDKs match what scripts/check.sh is run with locally.
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  gate:
    name: Lint, build, test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          swift format --version
      - name: scripts/check.sh
        run: ./scripts/check.sh

  server:
    # The group server on Linux, as it runs in Docker on the Mac mini: the contract package
    # (server/PilgrimAPI; the gate job above also runs it on macOS) and the Vapor server
    # (server/) against a real Postgres 17. TEST_DATABASE_URL makes the Postgres tests
    # mandatory here (locally they skip without it; `make -C server test` provides one).
    name: Group server (Linux, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2-noble
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilgrim
          POSTGRES_PASSWORD: pilgrim
          POSTGRES_DB: pilgrim_test
        options: >-
          --health-cmd "pg_isready -U pilgrim -d pilgrim_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://pilgrim:pilgrim@postgres:5432/pilgrim_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            server/.build
            server/PilgrimAPI/.build
          key: server-linux-${{ hashFiles('server/Package.resolved', 'server/Package.swift', 'server/PilgrimAPI/Package.swift') }}
          restore-keys: server-linux-
      - name: swift test (server/PilgrimAPI)
        run: swift test --package-path server/PilgrimAPI
      - name: swift build (server)
        run: swift build --package-path server --build-tests
      - name: swift test (server, Postgres)
        run: swift test --package-path server --skip-build

  admin-console:
    # web/admin (developer admin console). scripts/check.sh only checks its Swift snapshot is fresh.
    name: Admin console (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  xcode:
    # The Xcode project enforces member import visibility, which `swift build`
    # does not, so an import that is only "transitively" visible fails here.
    name: Xcode build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned
        run: |
          xcodebuild \
            -project PilgrimJournal/PilgrimJournal.xcodeproj \
            -scheme PilgrimJournalApp \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-tests:
    # `swift test` runs on macOS, which skips the `#if os(iOS)` code paths —
    # including LiveMarkdownTextEditorIOSTests, the hosted editor tests that
    # guard the typing release gate (docs/known-issues.md). The rest of
    # PilgrimJournalTests passes on iOS too, so the whole target runs here.
    name: iOS Simulator tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        # Simulator names change with each runner image, so take any available
        # iPhone on the newest installed iOS runtime instead of naming one.
        run: |
          device=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("SimRuntime.iOS"))
              | {rt: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)), d: .value[]}
              | select(.d.name | startswith("iPhone"))]
            | sort_by(.rt) | last | .d | "\(.udid) \(.name)"')
          if [ -z "$device" ] || [ "$device" = "null" ]; then
            xcrun simctl list devices available
            echo "::error::No available iPhone simulator"
            exit 1
          fi
          echo "Using ${device#* } (${device%% *})"
          echo "SIMULATOR_ID=${device%% *}" >> "$GITHUB_ENV"
      - name: xcodebuild test
        run: |
          xcodebuild test \
            -scheme PilgrimJournal-Package \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PilgrimJournalTests \
            -testLanguage ko -testRegion KR \
            CODE_SIGNING_ALLOWED=NO
