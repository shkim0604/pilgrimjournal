# Admin console for pilgrim.delight-house.org/admin.
#   cp web/admin/.env.example web/admin/.env   # then edit
#   docker compose -f web/admin/docker-compose.yml up -d --build
# With the bundled Cloudflare Tunnel (TUNNEL_TOKEN=... in web/admin/.env.tunnel):
#   docker compose -f web/admin/docker-compose.yml --profile tunnel up -d --build
#
# The console joins the shared network pilgrim-edge, where the group server's api answers as
# http://pilgrim-api:3100 (operator routes /internal/admin/v1, never through the tunnel).
# The console reads ADMIN_API_TOKEN (same value as server/.env.prod, 32+ bytes) and optionally
# ADMIN_API_URL (default http://pilgrim-api:3100) from .env; neither is set here, because
# ADMIN_API_URL without a token is refused at start-up.
# The network must exist first; create it once per machine (idempotent):
#   make -C server edge-network        # or: docker network create pilgrim-edge
name: pilgrim-admin

services:
  admin:
    build:
      context: ../..
      dockerfile: web/admin/Dockerfile
    env_file: .env
    # tini as PID 1 forwards SIGTERM, so docker stop/redeploys don't wait 10 s for a SIGKILL.
    init: true
    # Only reachable from this machine; the public route is the Cloudflare Tunnel.
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - admin-data:/data
    networks:
      - default
      - edge
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    # TUNNEL_TOKEN lives in its own file so the admin container (env_file: .env) never sees it.
    env_file:
      - path: .env.tunnel
        required: false
    # In the Zero Trust dashboard, point the public hostname at http://admin:8420, and put the
    # group server rule (path ^/(api/|i/|\.well-known/) → http://pilgrim-api:3100) above it.
    depends_on:
      - admin
    networks:
      - default
      - edge
    restart: unless-stopped

volumes:
  admin-data:

networks:
  edge:
    name: pilgrim-edge
    external: true
