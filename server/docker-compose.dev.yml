# Development override (`make dev`). Ports are bound to 127.0.0.1 only.
# Postgres is on 5433 so it does not clash with other local projects; `make test` uses it too
# (database pilgrim_test).
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  api:
    env_file: .env.dev
    ports:
      - "127.0.0.1:3100:3100"

  worker:
    env_file: .env.dev

  migrate:
    env_file: .env.dev
